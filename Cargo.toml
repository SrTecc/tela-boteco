[package]
name = "tela-boteco"
version = "0.1.0"
edition = "2021"
description = "Transmissão de tela do Boteco Copo Sujo"

[dependencies]
# As APIs do Windows em Rust. As features são escolhidas uma a uma de
# propósito: a crate inteira é enorme, e cada módulo ligado custa tempo de
# compilação. Este primeiro marco só precisa enumerar janelas e descobrir o
# processo dono de cada uma, que é o que resolve a escolha E o áudio.
# O macro que implementa interface COM em Rust expande para caminhos desta
# crate, entao ela precisa estar nomeada aqui.
windows-core = "0.58"
windows = { version = "0.58", features = [
    # Permite IMPLEMENTAR interface COM, e nao so chamar: o aviso de que a
    # ativacao do audio terminou chega por um callback que e nosso.
    "implement",
    "Win32_Security",
    "Win32_Media_Multimedia",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Gdi",
    # Para perguntar ao gerenciador de janelas se a janela está "encoberta":
    # é o que separa um aplicativo de verdade do fantasma que a loja do
    # Windows deixa para trás.
    "Win32_Graphics_Dwm",
    # Captura: o Windows Graphics Capture é WinRT, mas quem entrega o quadro é
    # uma textura do Direct3D. Daí os dois mundos aqui, mais as duas pontes
    # (`System_WinRT_*`) que traduzem um para o outro.
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    # Codificação: o Media Foundation é a porta do Windows para o chip de
    # codificação da placa. Cobre Intel, NVIDIA e AMD com o mesmo código, que é
    # o que permite um binário só para o PC de jogo e para o notebook.
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # Áudio por processo: é a razão de o app existir. O navegador não consegue
    # separar o som de um aplicativo do som do sistema; estas APIs conseguem.
    "Win32_Media_Audio",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
