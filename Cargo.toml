[package]
name = "tela-boteco"
version = "0.1.0"
edition = "2021"
description = "TransmissÃ£o de tela do Boteco Copo Sujo"

[dependencies]
# WebRTC em Rust. Ã‰ a peÃ§a que leva o vÃ­deo atÃ© o navegador de quem assiste,
# sem servidor no meio e sem recodificar: o H.264 que o chip produziu vai
# direto para a rede.
# 0.17 e nao 0.11: a de 2024 falha o aperto de mao criptografico com Chrome
# moderno ("invalid named curve"), porque o navegador oferece extensoes de TLS
# 1.3 que ela nao entende. Mesma API, zero mudanca de codigo.
#
# E nao 0.21: aquela e uma REESCRITA da API. A 0.17.2 e a ultima da linha atual,
# e migrar fica como item conhecido, nao como surpresa.
webrtc = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
# A oferta e a resposta viajam como JSON, que e o formato que o site ja usa.
serde_json = "1"
# Cliente HTTP para falar com o site. rustls em vez do TLS do sistema: o app
# vai ser baixado por gente qualquer, e depender da loja de certificados da
# maquina e mais uma coisa que pode faltar na hora errada.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# Log do WebRTC: sem ele, falha de rede aparece como a palavra "failed" e mais
# nada, e adivinhar motivo de ICE custa horas.
env_logger = "0.11"
# Opus: e o codec de som do WebRTC. O AAC que o gravador usa nao serve aqui,
# porque navegador nenhum aceita AAC em WebRTC.
rusty-opus = "1.0"

# As APIs do Windows em Rust. As features sÃ£o escolhidas uma a uma de
# propÃ³sito: a crate inteira Ã© enorme, e cada mÃ³dulo ligado custa tempo de
# compilaÃ§Ã£o. Este primeiro marco sÃ³ precisa enumerar janelas e descobrir o
# processo dono de cada uma, que Ã© o que resolve a escolha E o Ã¡udio.
# O macro que implementa interface COM em Rust expande para caminhos desta
# crate, entao ela precisa estar nomeada aqui.
windows-core = "0.58"
windows = { version = "0.58", features = [
    # Permite IMPLEMENTAR interface COM, e nao so chamar: o aviso de que a
    # ativacao do audio terminou chega por um callback que e nosso.
    "implement",
    "Win32_Security",
    "Win32_Media_Multimedia",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Gdi",
    # Para perguntar ao gerenciador de janelas se a janela estÃ¡ "encoberta":
    # Ã© o que separa um aplicativo de verdade do fantasma que a loja do
    # Windows deixa para trÃ¡s.
    "Win32_Graphics_Dwm",
    # Captura: o Windows Graphics Capture Ã© WinRT, mas quem entrega o quadro Ã©
    # uma textura do Direct3D. DaÃ­ os dois mundos aqui, mais as duas pontes
    # (`System_WinRT_*`) que traduzem um para o outro.
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    # CodificaÃ§Ã£o: o Media Foundation Ã© a porta do Windows para o chip de
    # codificaÃ§Ã£o da placa. Cobre Intel, NVIDIA e AMD com o mesmo cÃ³digo, que Ã©
    # o que permite um binÃ¡rio sÃ³ para o PC de jogo e para o notebook.
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # Ãudio por processo: Ã© a razÃ£o de o app existir. O navegador nÃ£o consegue
    # separar o som de um aplicativo do som do sistema; estas APIs conseguem.
    "Win32_Media_Audio",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
